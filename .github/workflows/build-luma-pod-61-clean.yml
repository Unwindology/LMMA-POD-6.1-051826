name: Build LUMA Pod 6.1 Clean

on:
  workflow_dispatch:

concurrency:
  group: luma-pod-61-clean-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          pwd
          ls -lah
          test -f Dockerfile
          test -f start.sh
          test -f start_kokoro.sh
          test -f kokoro_server.py
          test -f api_gateway.py
          test -f luma_server.py
          test -f luma_flusher.py
          test -f luma_tools_server.py
          test -f LUMA_README.md
          test -f LUMA_CURRENT_STATE.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute short SHA
        id: vars
        run: echo "sha7=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push clean image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            unwindology/luma-pod-61-051826:clean
            unwindology/luma-pod-61-051826:latest
            unwindology/luma-pod-61-051826:${{ github.sha }}
            unwindology/luma-pod-61-051826:${{ steps.vars.outputs.sha7 }}
          build-args: |
            IMAGE_BUILT_AT=${{ github.event.repository.updated_at }}
            GIT_SHA=${{ github.sha }}

      - name: Summary
        run: |
          echo "Pushed tags:" >> "$GITHUB_STEP_SUMMARY"
          echo "- unwindology/luma-pod-61-051826:clean" >> "$GITHUB_STEP_SUMMARY"
          echo "- unwindology/luma-pod-61-051826:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- unwindology/luma-pod-61-051826:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- unwindology/luma-pod-61-051826:${{ steps.vars.outputs.sha7 }}" >> "$GITHUB_STEP_SUMMARY"
